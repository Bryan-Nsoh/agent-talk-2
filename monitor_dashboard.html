<!DOCTYPE html>
<html>
<head>
    <title>Agent Run Monitor</title>
    <style>
        body {
            font-family: 'Monaco', 'Courier New', monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            color: #4ec9b0;
            border-bottom: 2px solid #4ec9b0;
            padding-bottom: 10px;
        }
        .section {
            background: #252526;
            border: 1px solid #3e3e42;
            border-radius: 4px;
            padding: 15px;
            margin: 15px 0;
        }
        .section h2 {
            color: #569cd6;
            margin-top: 0;
            font-size: 18px;
        }
        .strategy {
            margin: 10px 0;
            padding: 10px;
            background: #2d2d30;
            border-left: 3px solid #4ec9b0;
        }
        .strategy.done {
            border-left-color: #4ec9b0;
        }
        .strategy.running {
            border-left-color: #dcdcaa;
        }
        .metric {
            display: inline-block;
            margin-right: 20px;
            color: #9cdcfe;
        }
        .metric-value {
            color: #b5cea8;
            font-weight: bold;
        }
        .agent-row {
            font-size: 13px;
            padding: 3px 0;
            color: #808080;
        }
        .agent-row.finished {
            color: #4ec9b0;
        }
        .status-icon {
            display: inline-block;
            width: 15px;
            text-align: center;
        }
        .comparison {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .timestamp {
            color: #608b4e;
            font-size: 12px;
            text-align: right;
        }
        .error {
            color: #f48771;
            padding: 10px;
            background: #3c1f1e;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Agent Run Monitor</h1>
        <div class="timestamp" id="lastUpdate">Loading...</div>
        <div id="content">
            <p style="color: #808080;">Waiting for data...</p>
        </div>
    </div>

    <script>
        async function loadData() {
            try {
                const response = await fetch('monitor_data.json?t=' + Date.now());
                if (!response.ok) {
                    document.getElementById('content').innerHTML =
                        '<div class="error">Waiting for monitor script to generate data...</div>';
                    return;
                }
                const data = await response.json();
                renderDashboard(data);
                document.getElementById('lastUpdate').textContent =
                    `Last update: ${new Date().toLocaleTimeString()}`;
            } catch (error) {
                document.getElementById('content').innerHTML =
                    '<div class="error">Run monitor script to start: python monitor_script.py</div>';
            }
        }

        function renderDashboard(data) {
            let html = '<div class="comparison">';

            for (const [runType, runData] of Object.entries(data)) {
                html += `<div class="section">
                    <h2>${runType.toUpperCase().replace('_', ' ')}</h2>`;

                for (const [strategy, stats] of Object.entries(runData)) {
                    if (!stats) continue;

                    const isDone = stats.turn >= 100 || stats.finished === 5;
                    const statusClass = isDone ? 'done' : 'running';
                    const statusIcon = isDone ? '✓' : '⏳';

                    html += `<div class="strategy ${statusClass}">
                        <div style="font-size: 16px; color: #dcdcaa; margin-bottom: 5px;">
                            ${statusIcon} ${strategy.toUpperCase()}
                        </div>
                        <div>
                            <span class="metric">Turn: <span class="metric-value">${stats.turn}/100</span></span>
                            <span class="metric">Finished: <span class="metric-value">${stats.finished}/5</span></span>
                            <span class="metric">Messages: <span class="metric-value">${stats.messages}</span></span>
                        </div>
                        <div style="margin: 5px 0;">
                            <span class="metric">Distance: min=<span class="metric-value">${stats.min_dist}</span></span>
                            <span class="metric">avg=<span class="metric-value">${stats.avg_dist.toFixed(1)}</span></span>
                            <span class="metric">max=<span class="metric-value">${stats.max_dist}</span></span>
                        </div>
                        <div style="margin-top: 10px; font-size: 12px; color: #808080;">
                            Agents:
                        </div>`;

                    for (const agent of stats.agents) {
                        const finishedClass = agent.status === 'FINISHED' ? 'finished' : '';
                        const icon = agent.status === 'FINISHED' ? '✓' : ' ';
                        const distStr = agent.status === 'FINISHED' ? 'AT GOAL' : `dist=${agent.dist}`;
                        html += `<div class="agent-row ${finishedClass}">
                            <span class="status-icon">[${icon}]</span>
                            ${agent.id}: (${agent.x},${agent.y}) ${distStr}
                        </div>`;
                    }

                    html += `</div>`;
                }

                html += `</div>`;
            }

            html += '</div>';
            document.getElementById('content').innerHTML = html;
        }

        // Initial load
        loadData();

        // Refresh every 10 seconds
        setInterval(loadData, 10000);
    </script>
</body>
</html>
